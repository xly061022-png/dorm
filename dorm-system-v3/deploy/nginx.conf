# Put inside nginx's http context (e.g. sites-available/dorm.conf).
# Replace the domain and certificate paths here, not in application env vars.
server {
    listen 80;
    server_name dorm.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name dorm.example.com;
    ssl_certificate /etc/letsencrypt/live/dorm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dorm.example.com/privkey.pem;
    client_max_body_size 17m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite client-supplied forwarding headers; nginx is the sole proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
